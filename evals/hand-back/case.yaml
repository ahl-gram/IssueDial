schema_version: "1.1"
name: hand-back
description: Nothing is in hand or queued, so set_focus hands the dial back with no columns, or one column holding nothing.
context:
  scaffold_script: origin.sh
execution:
  max_turns: 6
  allowed_tools: [mcp__issue-dial__set_focus]
  prompt: |
    That's it for issue work today: Issue #42 is parked, nothing is in hand and nothing is queued next. Wrap up in one sentence.
graders:
  - name: columns-empty
    type: tool_used
    tool: mcp__issue-dial__set_focus
    input_match: '"columns"\s*:\s*\[\s*(\]|\{\s*"current"\s*:\s*null\s*,\s*"next"\s*:\s*\[\s*\]\s*\}\s*\])'
